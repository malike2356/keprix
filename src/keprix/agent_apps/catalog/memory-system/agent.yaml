name: memory-system
version: 1.0.0
display_name: Memory System
description: Capture → store → read → visualize against the single markdown vault.
category: productivity
icon: memory
runtime: python
entrypoint: agents.main:run
required_env: []
required_permissions: []
tools:
  - tools/memory.yaml
inputs:
  - id: query
    label: Search query
    type: text
    required: false
    placeholder: Optional vault search
  - id: note
    label: Optional note to capture
    type: textarea
    required: false
outputs:
  - id: markdown
    type: markdown
eval_suite: evals/basic.yaml
billing:
  tier: free
  meter: runs_per_month
