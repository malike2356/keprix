name: crm-import
version: 1.0.0
display_name: CRM Import Cleaner
description: Cleans messy CSV data (dedupe, normalize, map columns) before CRM import.
category: sales
icon: table
runtime: python
entrypoint: agents.main:run
required_env: []
required_permissions: []
tools:
  - tools/clean.yaml
inputs:
  - id: csv_text
    label: CSV text
    type: textarea
    required: true
    placeholder: Paste CSV including header row
  - id: target
    label: CRM target
    type: text
    required: false
    default: generic
outputs:
  - id: markdown
    type: markdown
eval_suite: evals/basic.yaml
billing:
  tier: free
  meter: runs_per_month
