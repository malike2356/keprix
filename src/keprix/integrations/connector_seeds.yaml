- id: github-agent-sync
  label: GitHub agent-sync
  category: knowledge
  description: Durable shared memory bridge over malike2356/agent-sync (Hermes/Fowler, Carina, Aiva, Keprix).
  icon: GitBranch
  auth_pattern: api_key
  scout_audit_class: external_write
  featured: true
  docs_url: /docs/features/agent-sync.md
  tags: [memory, github, hermes, sync]
  install_hint: Open Settings -> Agent sync, paste a GitHub PAT, enable, Save, then Pull. No .env required. Vault sync is Syncthing, not this connector.
  sample_playbook_node:
    type: agent_task
    data:
      label: "Agent sync: search shared memory"
      prompt: "Search github-agent-sync for recent durable notes and summarize."
      tools: [github_agent_sync]
      connector_id: github-agent-sync
- id: syncthing-obsidian
  label: Syncthing (Obsidian vault)
  category: knowledge
  description: Obsidian vault folder sync via Syncthing with a one-writer rule. Not for agent-sync memory/skills.
  icon: FolderSync
  auth_pattern: api_key
  scout_audit_class: external_write
  featured: true
  docs_url: /docs/features/syncthing.md
  tags: [obsidian, syncthing, vault, sync]
  install_hint: Open Settings -> Syncthing, paste Syncthing API key, set one writer (home or keprix), Save. Keep agent-sync on a separate path.
  sample_playbook_node:
    type: agent_task
    data:
      label: "Syncthing: vault status"
      prompt: "Check Syncthing vault bridge status and summarize one-writer role."
      tools: [syncthing_vault]
      connector_id: syncthing-obsidian
