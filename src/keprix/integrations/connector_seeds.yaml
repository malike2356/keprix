- id: notion
  label: Notion
  category: productivity
  description: Search pages and create workspace notes through the Notion MCP connector.
  icon: FileText
  auth_pattern: mcp
  mcp_server_id: notion
  scout_audit_class: external_write
  docs_url: /admin/mcp
  featured: true
  tags: [docs, wiki, notes]
  install_hint: Install the Notion MCP server, then select its tools in Playbook Studio.
  sample_playbook_node:
    type: agent_task
    data:
      label: "Notion: search pages"
      prompt: "Search Notion for {{ state.query }}"
      tools: [mcp_notion_search]
      connector_id: notion
