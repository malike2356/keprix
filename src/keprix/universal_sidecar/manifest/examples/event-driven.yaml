# Event-driven: inbound product events and outbound webhooks
contract_version: "1.0.0"
project_key: demo
display_name: Demo Project (event-driven)
deployment: local-dev
environment: local
base_url: http://127.0.0.1:8099
callback_urls:
  - http://127.0.0.1:8099/api/keprix/v1/events/ack
auth:
  profile: bearer
  vault_ref: env:DEMO_TOKEN
egress:
  allow_loopback: true
  allow_private_networks: false
  allowed_hosts:
    - 127.0.0.1
capabilities:
  - node: classify
    version: "1.0.0"
    scopes:
      - invoke:classify
      - events
  - node: summarise
    version: "1.0.0"
    scopes:
      - invoke:summarise
      - events
  - node: event.emit
    version: "1.0.0"
    scopes:
      - events
  - node: finish
    version: "1.0.0"
    scopes:
      - invoke:finish
memory:
  mode: subject
  retention_days: 14
  namespaces:
    - demo.events
webhooks:
  signature: hmac-sha256
  max_attempts: 8
  vault_ref: env:DEMO_WEBHOOK_SECRET
connectors:
  - key: order.get
    method: GET
    path: /api/orders/{id}
    purpose: Enrich inbound order.created events
    mode: read
    sensitivity: pii_minimised
    grants:
      - connector:order.get
events:
  - type: demo.order.created
    direction: inbound
    schema: order.created.v1
    sensitivity: internal
    dedupe: true
    delivery: at_least_once
    retention_days: 14
  - type: demo.order.updated
    direction: inbound
    schema: order.updated.v1
    sensitivity: internal
    dedupe: true
    delivery: at_least_once
    retention_days: 14
  - type: keprix.summary.ready
    direction: outbound
    schema: summary.ready.v1
    sensitivity: internal
    dedupe: true
    delivery: at_least_once
    callback: http://127.0.0.1:8099/webhooks/keprix
    retention_days: 7
feature_flags:
  events_stream: true
  webhooks_outbound: true
