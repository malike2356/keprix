id: property
title: Property vertical pack
description: Sheet types, metrics, and discovery adapters for UK property operators.
jurisdiction: UK
qualification_questions:
  - {id: budget, question: "What is your acquisition or refurbishment budget?", required: true}
  - {id: timeline, question: "What is your target completion or sale timeline?", required: true}
  - {id: portfolio, question: "How many properties are in your current portfolio?", required: false}
  - {id: funding_source, question: "What is the intended funding source?", required: true}
message_bank:
  first_contact: "We help property operators identify and qualify suitable opportunities. Would a short review be useful?"
  follow_up_1: "Following up on the property opportunity review. Is this still relevant?"
  follow_up_2: "Would a different timeline or property profile be more useful?"
  follow_up_3: "I will close this out for now. Reply if you want to revisit it."
  objection_reply: "Understood. I can provide the evidence and assumptions for review before any decision."
follow_up_ladder:
  - {stage: capture, after_hours: 24}
  - {stage: intent, after_hours: 48}
  - {stage: qualify, after_hours: 72}
  - {stage: nurture, after_days: 14}
crm_stages: [capture, intent, qualify, present, follow_up, human, nurture]
compliance_rules:
  - consent_required_before_outreach: true
  - no_scraping: true
  - jurisdiction: UK GDPR and PECR
escalation:
  auto_route_human: [complaint, legal_request, objection, regulated_advice, unsubscribe]
  auto_reply_allowed: [general_question, availability]
discovery:
  enabled: true
adapters:
  - property_csv
  - companies_house
  - web_directory
  - rightmove_http
  - zoopla_http
portal_adapters_default: disabled
portal_flag: KEPRIX_PROPERTY_PORTAL_ADAPTERS
legal_checklist: docs/security/property-portal-legal-checklist.md
ui_copy:
  scrape_claim: false
  note: Prefer CSV, Companies House, and web directory. Portal HTTP adapters stay off unless flagged.
stage_labels:
  discovered: New listing / lead
  enriched: Enriched property record
  listed: On list for review
  enrolled: In nurture
  customer: Instructed / retained
sheet_types:
  - id: property_data
    description: Property stock / comparables sheet
    markers: [property, address, bedroom, beds, epc, yield, valuation, postcode]
    columns:
      - {name: address, role: identity}
      - {name: postcode, role: geo}
      - {name: beds, role: metric}
      - {name: rent, role: metric}
      - {name: yield, role: metric}
      - {name: epc, role: metric}
      - {name: company_name, role: company_name}
      - {name: contact_email, role: contact_email}
      - {name: url, role: url}
    metrics: [beds, rent, yield, epc, price, sqft]
  - id: tenant_list
    description: Tenant / occupancy list
    markers: [tenant, lease, rent, landlord]
    columns:
      - {name: tenant_name, role: identity}
      - {name: property_address, role: identity}
      - {name: rent, role: metric}
      - {name: contact_email, role: contact_email}
      - {name: contact_phone, role: contact_phone}
    metrics: [rent, arrears, deposit]
  - id: landlord_pipeline
    description: Landlord / vendor pipeline
    markers: [landlord, vendor, pipeline, instruction]
    columns:
      - {name: landlord_name, role: company_name}
      - {name: contact_email, role: contact_email}
      - {name: contact_phone, role: contact_phone}
      - {name: stage, role: stage}
      - {name: portfolio_size, role: metric}
    metrics: [portfolio_size, estimated_fees]
