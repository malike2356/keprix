    data_touched: [vault items, provider keys]
    secrets_touched: [master key, API keys]
    tenant_scope: operator-scoped
    rebuild_plan: Port vault behavior into Keprix vault module; never call remote licence key services.
    test_mapping: tests/security/test_vault.py
    doc_mapping: docs/developer-identity.md

