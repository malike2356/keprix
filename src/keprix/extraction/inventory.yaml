features:
  - id: legacy-memory-rag
    name: pgvector RAG and hybrid search
    subsystem: memory
    owner: platform
    source_path: memory/db.ts
    target_prompt: "06"
    classification: public_core
    dependencies: [postgres, pgvector]
    data_touched: [workspace embeddings, episodic memory]
    secrets_touched: [database credentials via vault]
    tenant_scope: single-tenant self-host
    rebuild_plan: Rebuild Keprix memory backends with MIT schema; no legacy tenant tables copied.
    test_mapping: tests/memory/
    doc_mapping: docs/memory/

  - id: legacy-credentials-vault
