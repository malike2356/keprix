site_name: Keprix Documentation
site_description: Self-hosted AI agent OS, Community Edition
# Canonical URL for MkDocs; internal nav links stay relative. Override at build time via DOCS_SITE_URL.
site_url: http://127.0.0.1:3000/guide/
repo_url: https://github.com/malike2356/keprix
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: frontend/public/guide

exclude_docs: |
  internal/
  README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - toc:
      permalink: true

