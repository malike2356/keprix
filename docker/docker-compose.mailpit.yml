# Optional local SMTP capture for Soft Wall approve (Prompt 628).
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.mailpit.yml up -d
services:
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: keprix-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_BIND:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_BIND:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - keprix_network
