name: keprix

services:
  keprix-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: keprix-backend:latest
    container_name: keprix-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3333}:3333"
    volumes:
      - keprix_data:/data/keprix
      - ${HOME}/.keprix:/root/.keprix:z
    environment:
      - KEPRIX_DATABASE_URL=postgresql+asyncpg://keprix:${POSTGRES_PASSWORD:-changeme}@postgres:5432/keprix
      - KEPRIX_REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - KEPRIX_SEARXNG_URL=http://searxng:8080
    env_file:
      - path: ../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - keprix_network

  keprix-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: keprix-frontend:latest
    container_name: keprix-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://keprix-backend:3333
    env_file:
      - path: ../.env
        required: false
    depends_on:
      - keprix-backend
    networks:
      - keprix_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: keprix-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: keprix
      POSTGRES_USER: keprix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keprix -d keprix"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - keprix_network

  redis:
    image: redis:7-alpine
    container_name: keprix-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - keprix_network

  searxng:
    image: searxng/searxng:latest
    container_name: keprix-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    networks:
      - keprix_network

volumes:
  postgres_data:
  redis_data:
  keprix_data:

networks:
  keprix_network:
    driver: bridge
