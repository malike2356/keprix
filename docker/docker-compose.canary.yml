# Canary overlay: alternate localhost ports + container names.
# Requires base compose + prod overlay.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.canary.yml up -d
name: keprix-canary

services:
  keprix-backend:
    container_name: keprix-backend-canary
    ports: !override
      - "127.0.0.1:${CANARY_BACKEND_PORT:-3334}:3333"
    image: keprix-backend:${KEPRIX_IMAGE_TAG:-canary}

  keprix-frontend:
    container_name: keprix-frontend-canary
    ports: !override
      - "127.0.0.1:${CANARY_FRONTEND_PORT:-3001}:3000"
    image: keprix-frontend:${KEPRIX_IMAGE_TAG:-canary}
