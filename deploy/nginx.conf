# nginx reverse proxy for Keprix.
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/keprix
#   sudo ln -sf /etc/nginx/sites-available/keprix /etc/nginx/sites-enabled/keprix
#   sudo certbot --nginx -d app.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace app.example.com and certificate paths before use.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream keprix_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.example.com;

  # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;

  client_max_body_size 64m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://keprix_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
