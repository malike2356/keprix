# Keprix Contabo marketing-only stack (no backend / Postgres / Redis).
#
# Use after local image build + docker save/load (see
# shared/workspace-governance/CONTABO-LOCAL-IMAGE-DEPLOY.md).
#
# Does NOT bind host 80/443. Shared Carina nginx proxies keprixai.com.
#
#   docker compose --project-directory /home/malike/apps/keprix \
#     --env-file /home/malike/apps/keprix/.env \
#     -f deploy/contabo/docker-compose.marketing.yml up -d

name: keprix-marketing

services:
  keprix-frontend:
    image: keprix-frontend:${KEPRIX_IMAGE_TAG:-latest}
    container_name: keprix-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_CE_API_URL=
      - HOSTNAME=0.0.0.0
      - PORT=3000
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - proxy

networks:
  proxy:
    external: true
