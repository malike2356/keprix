# Journald drop-in for Keprix hosts.
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-keprix.conf /etc/systemd/journald.conf.d/keprix.conf
#   sudo systemctl restart systemd-journald

[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=14day
Compress=yes
