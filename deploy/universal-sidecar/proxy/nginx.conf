# WARNING: TLS termination for private clients only.
# Do not publish this upstream anonymously on the public internet.

upstream keprix_sidecar {
    server 127.0.0.1:3360;
}

server {
    listen 443 ssl;
    server_name sidecar.internal;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_client_certificate /etc/nginx/certs/clients.pem;
    # ssl_verify_client on;

    # Disable buffering for SSE
    location /sidecar/v1/ {
        proxy_pass http://keprix_sidecar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
