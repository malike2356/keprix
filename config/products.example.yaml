# Keprix products registry (example). Copy to config/products.yaml and enable products.
#
# No product-specific logic belongs in Keprix core. Enable products here or via:
#   KEPRIX_ENABLED_PRODUCTS=scout,example_vertical
#   KEPRIX_PRODUCTS_CONFIG=/path/to/products.yaml
#
# Per-product env flags also enable a product when set true.

version: 1

defaults:
  regulated_domains:
    - healthcare
    - legal
    - finance
    - safety
    - construction

products:
  # Optional governance connector (Labyrinth Scout extension).
  scout:
    display_name: "Scout"
    enabled: false
    extension_name: scout

  # Example vertical pack (disabled). Replace paths with your own domain assets.
  example_vertical:
    display_name: "Example vertical pack"
    enabled: false
    domain_packs:
      - borehole_drilling
    domain_intents:
      - config/domain_intents/borehole_drilling.yaml
    glossaries:
      - config/domain_glossaries/borehole_drilling_ghana_v1.yaml
    playbook_localization:
      - config/playbook_localization/ghana_borehole_advisor.yaml
    voice_categories:
      - config/voice_categories/borehole_drilling.yaml
    regulated_domains:
      - borehole_drilling

  # Example regulated vertical with audit defaults (disabled).
  example_compliance:
    display_name: "Example compliance pack"
    enabled: false
    env_flag: EXAMPLE_COMPLIANCE_ENABLED
    audit_domain_pack: example-compliance
    domain_packs:
      - example-compliance
    feature_flags:
      example_compliance: true
