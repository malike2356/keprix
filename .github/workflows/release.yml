name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  public-gtm-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public GTM gate (required for published releases)
        env:
          # Release must not claim public GTM without public GitHub.
          # Private quality gates stay a pre-release local/CI obligation (see readiness.md).
          KEPRIX_PUBLIC_GTM_SKIP_PRIVATE: "1"
          KEPRIX_SKIP_DOMAIN_CHECK: "1"
        run: bash scripts/check-public-gtm-gate.sh

  test:
    needs: public-gtm-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - name: Backend tests
        run: |
          uv sync --extra dev
          uv run pytest tests/ -q

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  docker-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            carinaai/keprix-backend:${{ github.event.release.tag_name }}
            carinaai/keprix-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            carinaai/keprix-frontend:${{ github.event.release.tag_name }}
            carinaai/keprix-frontend:latest

      - name: Verify public multi-architecture manifests
        run: |
          docker buildx imagetools inspect "carinaai/keprix-backend:${{ github.event.release.tag_name }}"
          docker buildx imagetools inspect "carinaai/keprix-frontend:${{ github.event.release.tag_name }}"
