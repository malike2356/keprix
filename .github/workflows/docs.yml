name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "mkdocs.yml"
      - "scripts/generate-docs.sh"
      - "scripts/generate_doc_pages.py"
      - "scripts/build-docs.sh"
      - ".env.example"
      - "landing/**"
      - "scripts/serve-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and doc tools
        run: |
          pip install -e .
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin
      - name: Build docs
        run: bash scripts/build-docs.sh
      - name: Doc tests
        run: pytest tests/docs -q
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
