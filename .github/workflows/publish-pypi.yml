name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      tag:
        description: Existing immutable tag, for example v0.16.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and component versions
        run: |
          test "v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${{ inputs.tag }}"
          python3 scripts/check-release-version-sync.py
      - name: Build isolated wheel and source archive
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke wheel on Python 3.11
        run: PYTHON=python bash scripts/smoke-built-wheel.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke-python-312:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ inputs.tag }}
          path: dist
      - run: PYTHON=python bash scripts/smoke-built-wheel.sh dist

  publish:
    needs: [build-and-test, smoke-python-312]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/project/keprix/' || 'https://test.pypi.org/project/keprix/' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ inputs.tag }}
          path: dist
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          packages-dir: dist
          attestations: true
