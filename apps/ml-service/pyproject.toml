[project]
name = "keprix-ml-service"
version = "0.1.0"
description = "Internal ML service for Keprix agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "anthropic>=0.34",
  "voyageai>=0.3",
  "openai>=1.35",
  "groq>=0.9",
  "redis[hiredis]>=5.0",
  "structlog>=24",
  "tenacity>=8.3",
  "tiktoken>=0.7",
  "langdetect>=1.0.9",
  "fasttext-langdetect>=1.0.5",
]

[project.optional-dependencies]
local = [
  "torch>=2.3",
  "transformers>=4.43",
  "faster-whisper>=1.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "numpy>=1.26",
]
