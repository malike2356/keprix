# Default Fly config points at the fullstack recipe.
# See fly.fullstack.toml header for setup (Postgres, Redis, volume, secrets).
# This is an optional helper. Production default remains VPS Compose + Caddy.

app = "keprix"
primary_region = "lhr"

[build]
  dockerfile = "docker/Dockerfile.fly"

[env]
  BACKEND_PORT = "3333"
  PORT = "3000"
  KEPRIX_HOME = "/data/keprix"
  KEPRIX_LOGS_DIR = "/data/keprix/logs"
  KEPRIX_GUARDRAILS_DEFAULT = "true"
  KEPRIX_VAULT_AUTO_BACKUP = "true"
  KEPRIX_VAULT_AUTO_CAPTURE = "true"
  NEXT_PUBLIC_API_URL = ""
  NEXT_PUBLIC_CE_API_URL = ""
  BACKEND_REWRITE_URL = "http://127.0.0.1:3333"

[processes]
  web = "/app/start-fly.sh"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/"

[[mounts]]
  source = "keprix_data"
  destination = "/data/keprix"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
