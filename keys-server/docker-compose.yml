services:
  keys-db:
    image: postgres:15
    environment:
      POSTGRES_USER: keys
      POSTGRES_PASSWORD: keys
      POSTGRES_DB: keys_server
    ports:
      - "5433:5432"
    volumes:
      - keys_pg_data:/var/lib/postgresql/data

  keys-api:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    depends_on:
      - keys-db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8090

volumes:
  keys_pg_data:
