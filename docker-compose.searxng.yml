# Standalone SearXNG for Keprix web search (local dev or API-only backend).
#
# Start:
#   docker compose -f docker-compose.searxng.yml up -d
#
# Then in Keprix: Settings -> Web search -> SearXNG
#   SEARXNG_URL=http://localhost:8080
#
# Test:
#   curl -s "http://localhost:8080/search?q=test&format=json" | head -c 200

name: keprix-searxng

services:
  searxng:
    image: searxng/searxng:latest
    container_name: keprix-searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_BIND:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./docker/searxng.example:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: "http://localhost:${SEARXNG_PORT:-8080}/"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
